name: Build JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: CustomWorlds-jar
        path: build/libs/*.jar
