# Расстояние между структурами в БЛОКАХ (примерно: по одной на квадрат такого размера).
# Больше число = реже. 0 = отключить тип.
dungeons:
  enabled: true

  # ---- Обычный мир
  overworld-crypt: 3500       # малая: подземный склеп
  overworld-tower: 3000       # малая: разрушенная башня
  overworld-pavilion: 2500    # малая: павильон с тайником
  overworld-fort: 1300        # СРЕДНЯЯ: разрушенный форт с башнями
  overworld-ziggurat: 1800    # БОЛЬШАЯ: зиккурат с сейфами

  # ---- Ад (мир "теснее" в 8 раз, расстояния меньше)
  nether-bunker: 1800         # малая
  nether-altar: 1500          # малая
  nether-forge: 700           # СРЕДНЯЯ: кузня
  nether-citadel: 900         # БОЛЬШАЯ: цитадель

  # ---- Энд (часть мест попадает в пустоту и пропускается)
  end-shrine: 1800            # малая: святилище
  end-vault: 700              # СРЕДНЯЯ: зловещее хранилище 15x15
  end-spire: 800              # СРЕДНЯЯ: шпиль с лазом на 3 этажа
  end-grand: 1000             # БОЛЬШАЯ: великое зловещее хранилище 31x31
  end-safe-radius: 110        # рядом с главным островом не строим

# Миры, которые автоматически загружаются при старте ("имя:тип", тип = normal|nether|end)
worlds: []
